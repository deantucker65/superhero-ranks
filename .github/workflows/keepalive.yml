name: Supabase keep-alive

# Supabase free projects pause after 7 days with no database activity.
# This runs a tiny query every 2 days so the project stays awake.
on:
  schedule:
    - cron: '0 6 */2 * *' # 06:00 UTC, every 2nd day
  workflow_dispatch: {} # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/actors?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP status: $code"
          if [ "$code" != "200" ]; then
            echo "Keep-alive failed (expected 200)."
            exit 1
          fi
          echo "Keep-alive succeeded."
